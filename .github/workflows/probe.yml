name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright-core@1.48.2 >/dev/null 2>&1
      - run: node scripts/probe/fora.mjs > out.txt 2>&1 || true
      - run: |
          mkdir pub && cp out.txt *.txt page-*.html pub/ 2>/dev/null; cd pub && git init -q -b probe-out && git add . && git -c user.name=bot -c user.email=b@b commit -qm out && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} probe-out
