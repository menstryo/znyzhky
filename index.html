<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Знижки</title>
<style>
  :root { --accent: #cc211c; --bg: #f2f2f2; --card: #fff; --text: #222; --muted: #777; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #222; --text: #eee; --muted: #999; } }
  body { margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { line-height: 1.5; }
  .muted { color: var(--muted); font-size: 14px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: bold;
          padding: 12px 20px; border-radius: 8px; margin: 8px 0; }
  ul { padding-left: 20px; line-height: 1.7; }
  #stats li b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Знижки</h1>
    <div class="muted">Акції Сільпо, АТБ, Varus та Аврори для iOS 6+</div>
    <p><a class="btn" href="Znyzhky.ipa">Завантажити .ipa</a><br>
    <span class="muted">Встановлення через 3uTools (потрібен AppSync Unified).</span></p>
    <h3>Зараз в акції</h3>
    <ul id="stats"><li class="muted">завантаження…</li></ul>
    <p class="muted" id="upd"></p>
    <p class="muted">Розробник: <a href="https://t.me/menstryo">t.me/menstryo</a></p>
  </div>
</main>
<script>
fetch("index.json?t=" + Date.now()).then(r => r.json()).then(j => {
  const ul = document.getElementById("stats");
  ul.innerHTML = "";
  for (const s of j.stores) {
    const li = document.createElement("li");
    li.innerHTML = s.count
      ? `${s.name}: <b>${s.count}</b> товарів, до −${s.max}%${s.ok ? "" : " <span class=muted>(дані застарілі)</span>"}`
      : `${s.name}: <span class=muted>недоступно</span>`;
    ul.appendChild(li);
  }
  document.getElementById("upd").textContent = "Оновлено: " + new Date(j.updated).toLocaleString("uk-UA");
}).catch(() => { document.getElementById("stats").innerHTML = "<li class=muted>дані ще не зібрано</li>"; });
</script>
</body>
</html>
